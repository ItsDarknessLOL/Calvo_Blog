<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de compuertas lógicas</title><desc id="desc">Compuertas AND y OR conectadas con entradas y salida.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111a24"/><stop offset="1" stop-color="#090b0f"/></linearGradient>
    <linearGradient id="line" x2="1"><stop stop-color="#8d7200"/><stop offset=".5" stop-color="#ffcc00"/><stop offset="1" stop-color="#d99f00"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/>
  <path d="M50 338h110m260 0h150m260 0h260" stroke="#ffcc00" stroke-width="18" opacity=".14" filter="url(#glow)"/>
  <g fill="none" stroke="url(#line)" stroke-width="10" stroke-linejoin="round">
    <path d="M160 210h145c125 0 125 255 0 255H160z"/><path d="M570 210h150l160 128-160 127H570z"/>
    <path d="M40 338h120m310 0h100m330 0h260"/>
  </g>
  <g fill="url(#line)" filter="url(#glow)"><circle cx="160" cy="210" r="18"/><circle cx="160" cy="465" r="18"/><circle cx="420" cy="338" r="18"/><circle cx="880" cy="338" r="18"/></g>
  <g fill="#e5e7eb" font-family="system-ui,sans-serif" font-size="36" font-weight="700"><text x="82" y="170">A</text><text x="82" y="520">B</text><text x="600" y="330">AND</text><text x="725" y="330">OR</text><text x="950" y="330">OUT</text></g>
</svg>
