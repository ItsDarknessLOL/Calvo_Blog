<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Laboratorio interactivo</title>
  <desc id="desc">Panel técnico inclinado con controles y un circuito de prueba.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08090b"/><stop offset=".5" stop-color="#101923"/><stop offset="1" stop-color="#08090b"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#1c2733"/><stop offset="1" stop-color="#0a0d12"/></linearGradient>
    <linearGradient id="yellow" x2="1"><stop stop-color="#886d00"/><stop offset=".45" stop-color="#ffcc00"/><stop offset="1" stop-color="#d39f00"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="820" cy="770" rx="560" ry="60" fill="#000" opacity=".7" filter="url(#shadow)"/>
  <g transform="skewY(-5) rotate(-1 800 450)">
    <rect x="220" y="150" width="1160" height="590" rx="34" fill="#000" opacity=".8" transform="translate(24 28)"/>
    <rect x="220" y="150" width="1160" height="590" rx="34" fill="url(#panel)" stroke="url(#yellow)" stroke-width="8"/>
    <path d="M280 270h1040M280 635h1040" stroke="#ffcc00" stroke-opacity=".2" stroke-width="2"/>
    <g fill="#dce3ea"><circle cx="300" cy="215" r="13"/><circle cx="345" cy="215" r="13"/><circle cx="390" cy="215" r="13"/></g>
    <g fill="none" stroke="url(#yellow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M360 440h220l90-90h160l110 100h300"/>
      <path d="M470 560v-75l100-100M925 450v110h170"/>
    </g>
    <g filter="url(#glow)"><circle cx="580" cy="440" r="35" fill="#ffcc00" opacity=".85"/><circle cx="830" cy="350" r="35" fill="#ffcc00" opacity=".85"/><circle cx="940" cy="450" r="35" fill="#d1d5db" opacity=".7"/></g>
    <path d="M1130 335l160 110-160 110z" fill="none" stroke="#ffcc00" stroke-width="10" opacity=".9"/>
    <rect x="330" y="675" width="170" height="16" rx="8" fill="#ffcc00"/><rect x="520" y="675" width="90" height="16" rx="8" fill="#d1d5db" opacity=".4"/>
  </g>
</svg>
