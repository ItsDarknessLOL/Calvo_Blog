<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Código y líneas de conexión</title>
  <desc id="desc">Ventana de terminal flotante con líneas de código y conexiones digitales.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090a0c"/><stop offset=".6" stop-color="#121822"/><stop offset="1" stop-color="#090a0c"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#202b38"/><stop offset="1" stop-color="#0b0e14"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#9fb3c8" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <g fill="none" stroke="#ffcc00" stroke-linecap="round" opacity=".55">
    <path stroke-width="5" d="M0 180h240l90 90h160M1600 690h-290l-120-120h-190M1100 0v160l-90 90"/>
    <path stroke-width="2" d="M80 700h260l90-90h150M1420 220h-210l-80 80"/>
  </g>
  <g transform="rotate(-4 800 450)">
    <rect x="300" y="180" width="1000" height="560" rx="24" fill="#000" opacity=".7" transform="translate(22 26)"/>
    <rect x="300" y="180" width="1000" height="560" rx="24" fill="url(#window)" stroke="#ffcc00" stroke-width="6"/>
    <path d="M300 265h1000" stroke="#ffcc00" stroke-opacity=".35" stroke-width="2"/>
    <g fill="#ffcc00"><circle cx="350" cy="222" r="12"/><circle cx="390" cy="222" r="12"/></g><circle cx="430" cy="222" r="12" fill="#d1d5db" opacity=".5"/>
    <g font-family="ui-monospace,monospace" font-size="34">
      <text x="380" y="345" fill="#ffcc00">$</text><text x="425" y="345" fill="#e5e7eb">build --learn</text>
      <text x="380" y="420" fill="#8aa4bd">01</text><text x="440" y="420" fill="#e5e7eb">const practice = true;</text>
      <text x="380" y="495" fill="#8aa4bd">02</text><text x="440" y="495" fill="#e5e7eb">if (curious) {'{'}</text>
      <text x="440" y="570" fill="#ffcc00">learn();</text><text x="440" y="645" fill="#e5e7eb">{'}'}</text>
    </g>
    <rect x="1180" y="335" width="5" height="38" fill="#ffcc00" filter="url(#glow)"/>
  </g>
</svg>
